<title>Ledgerline</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: ledger-book app — fixed left index rail on desktop, bottom tab strip on phones; content in a single scrolling column of ledger "folios". */
:root{
  --bg:#EDF1EE; --surface:#FBFCFB; --surface-2:#E3EAE6; --ink:#10201A; --ink-2:#3F5149; --muted:#66776F;
  --line:#D3DCD7; --grid:#E3E9E5; --accent:#0F7B5C; --accent-ink:#FFFFFF; --accent-soft:#D5ECE2;
  --inc:#1F6FB2; --spend:#E0743A; --flow:#9FB3AA;
  --good:#0B7A38; --good-bg:#DDF1E3; --warn:#8A5A00; --warn-bg:#FCEFCB; --bad:#B42F2F; --bad-bg:#F8E0DD;
  --h0:#E3EAE6; --h1:#cde2fb; --h2:#9ec5f4; --h3:#6da7ec; --h4:#3987e5; --h5:#1c5cab; --hink:#10201A; --hink-strong:#FFFFFF;
  --shadow:0 1px 0 rgba(16,32,26,.04), 0 8px 24px -16px rgba(16,32,26,.25);
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Instrument Sans", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:14px; --r-sm:9px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0A110F; --surface:#111A17; --surface-2:#1A2622; --ink:#E3ECE7; --ink-2:#B3C1BA; --muted:#85968E;
  --line:#23312C; --grid:#1C2824; --accent:#3DBF8F; --accent-ink:#05130E; --accent-soft:#143528;
  --inc:#3987E5; --spend:#D95926; --flow:#5E7D71;
  --good:#45C978; --good-bg:#12301E; --warn:#F2B33D; --warn-bg:#3A2C0E; --bad:#EF7070; --bad-bg:#3A1818;
  --h0:#1A2622; --h1:#16304F; --h2:#1C4E8C; --h3:#2A6FC4; --h4:#4E92E6; --h5:#9EC5F4; --hink:#E3ECE7; --hink-strong:#08121E;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 30px -18px rgba(0,0,0,.8); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0A110F; --surface:#111A17; --surface-2:#1A2622; --ink:#E3ECE7; --ink-2:#B3C1BA; --muted:#85968E;
  --line:#23312C; --grid:#1C2824; --accent:#3DBF8F; --accent-ink:#05130E; --accent-soft:#143528;
  --inc:#3987E5; --spend:#D95926; --flow:#5E7D71;
  --good:#45C978; --good-bg:#12301E; --warn:#F2B33D; --warn-bg:#3A2C0E; --bad:#EF7070; --bad-bg:#3A1818;
  --h0:#1A2622; --h1:#16304F; --h2:#1C4E8C; --h3:#2A6FC4; --h4:#4E92E6; --h5:#9EC5F4; --hink:#E3ECE7; --hink-strong:#08121E;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 30px -18px rgba(0,0,0,.8); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;margin:0;text-wrap:balance}
p{margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.muted{color:var(--muted)} .ink2{color:var(--ink-2)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* App frame */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;padding:22px 14px;border-right:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 18px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand-mark svg{display:block}
.brand b{font-family:var(--f-display);font-size:19px;letter-spacing:-.02em}
.navbtn{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border:0;background:none;border-radius:10px;cursor:pointer;color:var(--ink-2);font-weight:500;text-align:left}
.navbtn:hover{background:var(--surface-2);color:var(--ink)}
.navbtn[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.navbtn svg{flex:none;width:18px;height:18px}
.rail .spacer{flex:1}
.store-badge{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--muted);padding:10px;border-top:1px solid var(--line);margin-top:8px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:5px;background:var(--muted)}
.dot.ok{background:var(--good)} .dot.warn{background:var(--warn)}

main{min-width:0;padding-bottom:40px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.topbar-in{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1240px;margin:0 auto}
.topbar h1{font-size:22px;flex:1;min-width:0}
.wrap{max-width:1240px;margin:0 auto;padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}

.monthpick{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:2px}
.monthpick button{border:0;background:none;width:30px;height:30px;border-radius:8px;cursor:pointer;color:var(--ink-2)}
.monthpick button:hover{background:var(--surface-2)}
.monthpick span{min-width:84px;text-align:center;font-weight:600;font-size:14px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 13px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h h2{font-size:17px}
.card-h .sub{font-size:13px;color:var(--muted)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}

/* KPI ledger tiles */
.kpi{display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .v{font-family:var(--f-display);font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:lining-nums}
.kpi .d{font-size:13px;color:var(--ink-2)}
.kpi .total{border-bottom:3px double var(--line);padding-bottom:6px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}

.demo-banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-radius:var(--r);border:1px dashed var(--accent);background:var(--accent-soft)}
.demo-banner p{flex:1;min-width:220px;font-size:14px}

.chartbox{position:relative;height:240px}
.chartbox.tall{height:300px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* Bar list (category breakdown) */
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:baseline;cursor:pointer;border-radius:8px;padding:2px 4px;margin:0 -4px}
.bar-row:hover{background:var(--surface-2)}
.bar-row .nm{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .amt{font-size:13px}
.track{grid-column:1/-1;height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden;position:relative}
.fill{height:100%;background:var(--spend);border-radius:999px}
.fill.acc{background:var(--accent)} .fill.inc{background:var(--inc)}
.fill.over{background:var(--bad)} .fill.near{background:var(--warn)}
.pace{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.55}

/* Tables / lists */
.tx-day{display:flex;justify-content:space-between;align-items:baseline;padding:14px 2px 6px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted);font-weight:600}
.tx{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--grid);cursor:pointer}
.tx:hover{background:var(--surface-2)}
.tx .mono{width:36px;height:36px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;color:var(--ink-2);font-size:15px}
.tx .t1{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .t2{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .amt{text-align:right;font-size:14px}
.tx.excluded{opacity:.45}
.tx input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.tx .chk{display:none}
.selecting .tx .chk{display:block}
.selecting .tx{grid-template-columns:auto 36px minmax(0,1fr) auto}
.tag{font-size:11px;font-weight:600;padding:1px 6px;border-radius:5px;background:var(--surface-2);color:var(--ink-2);margin-left:4px}
.tag.biz{background:var(--accent-soft);color:var(--accent)}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.input,select.input,textarea.input{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 10px;min-width:0;max-width:100%}
.input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.search{flex:1 1 200px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--ink-2);min-width:0}
label.f .input{font-weight:400;color:var(--ink)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
.switch{display:flex;align-items:center;gap:9px;font-size:14px;cursor:pointer}
.switch input{width:18px;height:18px;accent-color:var(--accent)}

.ltable{width:100%;border-collapse:collapse;font-size:14px}
.ltable th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.ltable td{padding:9px 8px;border-bottom:1px solid var(--grid);vertical-align:middle}
.ltable td.r,.ltable th.r{text-align:right}
.ltable tr.totalrow td{border-top:1px solid var(--ink);border-bottom:3px double var(--line);font-weight:600}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* Insights */
.ins{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--grid)}
.ins:last-child{border-bottom:0}
.ins .sev{align-self:stretch;border-radius:4px;background:var(--line)}
.ins .sev.bad{background:var(--bad)} .ins .sev.warn{background:var(--warn)} .ins .sev.good{background:var(--good)} .ins .sev.info{background:var(--inc)}
.ins h3{font-family:var(--f-body);font-size:15px;font-weight:600}
.ins p{font-size:13.5px;color:var(--ink-2);margin-top:3px}
.ins .yr{text-align:right;white-space:nowrap}
.ins .yr b{display:block;font-family:var(--f-num);font-size:15px}
.ins .yr span{font-size:11px;color:var(--muted)}

.big-save{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap}
.big-save .v{font-family:var(--f-display);font-size:42px;font-weight:700;letter-spacing:-.03em;line-height:1;color:var(--accent)}

/* Calendar heatmap */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:10.5px;text-align:center;color:var(--muted);font-weight:600;letter-spacing:.06em}
.cal .c{aspect-ratio:1/1;max-width:100%;border-radius:7px;display:flex;flex-direction:column;justify-content:space-between;padding:4px 5px;font-size:10.5px;background:var(--h0);color:var(--hink);cursor:default;min-width:0}
.cal .c.e{background:none}
.cal .c b{font-family:var(--f-num);font-weight:500;font-size:10px;overflow:hidden;white-space:nowrap}
.cal .c.l1{background:var(--h1)} .cal .c.l2{background:var(--h2)} .cal .c.l3{background:var(--h3)} .cal .c.l4{background:var(--h4);color:var(--hink-strong)} .cal .c.l5{background:var(--h5);color:var(--hink-strong)}
.cal .c.today{outline:2px solid var(--ink);outline-offset:-2px}
.ramp{display:flex;gap:3px;align-items:center;font-size:11px;color:var(--muted)}
.ramp i{width:14px;height:10px;border-radius:3px;display:inline-block}

/* Sankey */
.sankey text{font-family:var(--f-body);fill:var(--ink)}
.sankey .lbl2{fill:var(--muted);font-family:var(--f-num);font-size:11px}

/* Sheet (modal) */
.sheet-bg{position:fixed;inset:0;background:rgba(5,12,9,.45);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--surface);border-radius:18px;width:min(640px,100%);max-height:min(88vh,900px);display:flex;flex-direction:column;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);border:1px solid var(--line)}
.sheet.wide{width:min(900px,100%)}
.sheet-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.sheet-h h2{font-size:18px;flex:1}
.sheet-b{padding:16px 18px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.sheet-f{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line)}
.iconbtn{border:0;background:none;width:34px;height:34px;border-radius:9px;cursor:pointer;color:var(--ink-2);display:grid;place-items:center}
.iconbtn:hover{background:var(--surface-2)}

.drop{border:2px dashed var(--line);border-radius:var(--r);padding:26px 16px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;cursor:pointer;background:var(--bg)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{font-family:var(--f-display);font-size:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.chip:hover{border-color:var(--accent);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.note{font-size:13px;color:var(--ink-2);background:var(--bg);border-radius:10px;padding:10px 12px;border:1px solid var(--line)}
.note.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}

/* Chat */
.chat{display:flex;flex-direction:column;gap:12px}
.msg{max-width:min(720px,92%);padding:11px 14px;border-radius:14px;font-size:14.5px;line-height:1.55}
.msg.u{align-self:flex-end;background:var(--ink);color:var(--surface);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.a ul{margin:6px 0;padding-left:20px} .msg.a p+p{margin-top:8px}
.composer{display:flex;gap:8px;position:sticky;bottom:0;padding-block:10px;background:var(--bg)}
.composer textarea{flex:1;resize:none;min-height:46px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-size:14px;z-index:80;max-width:calc(100% - 32px);box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}

.tabbar{display:none}
.empty{padding:28px 10px;text-align:center;color:var(--muted);font-size:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--grid);font-size:14px}
.kv:last-child{border-bottom:0}
.progress{height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.progress > i{display:block;height:100%;background:var(--accent);border-radius:999px}
.acct{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--grid)}
.acct:last-child{border-bottom:0}
.acct .t2{font-size:12.5px;color:var(--muted)}
.group-h{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){ .spin{animation-duration:3s} *{scroll-behavior:auto!important} }

@media (max-width:1020px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .g2,.g3{grid-template-columns:minmax(0,1fr)} .span2{grid-column:auto}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0;cursor:pointer;border-radius:10px}
  .tabbar button[aria-current="page"]{color:var(--accent)}
  .tabbar button svg{width:22px;height:22px}
  .tabbar .plus span.pl{width:44px;height:34px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
  .topbar h1{font-size:19px}
  .kpi .v{font-size:25px}
  .sheet-bg{align-items:flex-end;padding:0}
  .sheet,.sheet.wide{width:100%;border-radius:18px 18px 0 0;max-height:92vh;padding-bottom:env(safe-area-inset-bottom,0px)}
  .form{grid-template-columns:minmax(0,1fr)}
  .toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  .hide-m{display:none!important}
}
